<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#0E274A"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="4"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0284C7" stroke-width="2.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#1E40AF" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#1E40AF" stroke-width="2" opacity="0.4"/>

  <!-- Marine Wave Accents -->
  <path d="M 120 380 Q 188 350 256 380 T 392 380" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 150 410 Q 203 385 256 410 T 362 410" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Compass Star / ORCA Core Emblem -->
  <g filter="url(#glow)">
    <!-- North Pointer (Gold) -->
    <polygon points="256,90 280,240 256,256" fill="url(#goldGrad)"/>
    <polygon points="256,90 232,240 256,256" fill="#D97706"/>
    
    <!-- South Pointer (Cyan) -->
    <polygon points="256,422 280,272 256,256" fill="url(#accentGrad)"/>
    <polygon points="256,422 232,272 256,256" fill="#0369A1"/>

    <!-- East Pointer -->
    <polygon points="422,256 272,280 256,256" fill="#38BDF8"/>
    <polygon points="422,256 272,232 256,256" fill="#0284C7"/>

    <!-- West Pointer -->
    <polygon points="90,256 240,280 256,256" fill="#38BDF8"/>
    <polygon points="90,256 240,232 256,256" fill="#0284C7"/>
  </g>

  <!-- Central Hub -->
  <circle cx="256" cy="256" r="22" fill="#0B1528" stroke="#FCD34D" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="#38BDF8"/>

  <!-- Subtitle Text -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#F8FAFC" letter-spacing="6">ORCA</text>
</svg>
